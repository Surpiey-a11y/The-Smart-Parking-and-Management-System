<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In — SmartPark</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
  <div class="app-container">
    <div id="page-login" class="page active">
      <h1><i class="fas fa-parking"></i> SmartPark</h1>
      <div class="subhead">Welcome back — sign in to reserve</div>

      <div class="form-card">
        <div id="login-error" class="error-msg hidden">
          <i class="fas fa-exclamation-circle"></i>
          <span id="login-error-text">Invalid email or password.</span>
        </div>

        <form id="login-form">
          <div class="input-group">
            <label><i class="fas fa-envelope"></i> Email address</label>
            <input type="email" id="login-email" placeholder="name@example.com" autocomplete="email">
          </div>
          <div class="input-group">
            <label><i class="fas fa-lock"></i> Password</label>
            <input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password">
          </div>
          <button type="submit" class="btn" id="login-btn">
            <i class="fas fa-sign-in-alt"></i> Log in
          </button>
        </form>

        <div class="link-text">
          New to SmartPark? <a href="index.html" id="go-to-signup">Create an account</a>
        </div>
      </div>
    </div>

    <div id="toast" class="toast">
      <i class="fas fa-check-circle" style="margin-right: 10px;"></i>
      <span id="toast-text"></span>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
