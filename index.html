<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Parking System</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
  <div class="app-container">
    <div id="page-signup" class="page active">
      <h1><i class="fas fa-parking"></i> SmartPark</h1>
      <div class="subhead">Create your account — start parking smarter</div>

      <div class="form-card">
        <div id="signup-error" class="error-msg hidden">
          <i class="fas fa-exclamation-circle"></i>
          <span id="signup-error-text">Please fill all fields.</span>
        </div>
        <form id="signup-form">
          <div class="input-group">
            <label><i class="fas fa-user"></i> Full name</label>
            <input type="text" id="signup-name" placeholder="name" autocomplete="name">
          </div>
          <div class="input-group">
            <label><i class="fas fa-envelope"></i> Email address</label>
            <input type="email" id="signup-email" placeholder="emailaddress" autocomplete="email">
          </div>
          <div class="input-group">
            <label><i class="fas fa-lock"></i> Password</label>
            <input type="password" id="signup-password" placeholder="••••••••" autocomplete="new-password">
          </div>
          <div class="input-group">
            <label><i class="fas fa-check-circle"></i> Confirm password</label>
            <input type="password" id="signup-confirm" placeholder="••••••••" autocomplete="off">
          </div>
          <button type="submit" class="btn" id="signup-btn">
            <i class="fas fa-user-plus"></i> Create account
          </button>
        </form>
        <div class="link-text">
          Already have an account? <a href="login.html" id="go-to-login">Log in</a>
        </div>
      </div>
    </div>

    <div id="toast" class="toast">
      <i class="fas fa-check-circle" style="margin-right: 10px;"></i>
      <span id="toast-text"></span>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
