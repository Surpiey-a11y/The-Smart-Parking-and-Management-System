<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VIP Reservation — SmartPark</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
  <div class="app-container">
    <div id="page-vip" class="page active vip-page">

  
      <div class="parking-header">
        <h1><i class="fas fa-crown"></i> VIP Reservation</h1>
        <div class="header-actions">
          <div class="user-badge">
            <i class="fas fa-user-circle"></i>
            <span id="user-display-name">User</span>
          </div>
          <a href="public.html" class="logout-btn">
            <i class="fas fa-arrow-left"></i> Back
          </a>
        </div>
      </div>

      <div class="subhead">
        Select a date and time, then pick an available VIP slot to confirm your booking.
      </div>

    
      <div class="booking-datetime">
        <div class="datetime-field">
          <label for="booking-date">
            <i class="fas fa-calendar-day"></i> Date
          </label>
          <input type="date" id="booking-date" required>
        </div>

        <div class="datetime-field">
          <label for="booking-time">
            <i class="fas fa-clock"></i> Start Time
          </label>
          <input type="time" id="booking-time" required>
        </div>

        <div class="datetime-field">
          <label for="booking-duration">
            <i class="fas fa-hourglass-half"></i> Duration
          </label>
          <select id="booking-duration" required>
            <option value="30">30 minutes</option>
            <option value="60">1 hour</option>
            <option value="120" selected>2 hours</option>
            <option value="240">4 hours</option>
          </select>
        </div>
      </div>

      <!-- Booking summary line -->
      <div class="booking-summary" id="booking-summary">
        <i class="fas fa-info-circle"></i>
        <span id="booking-summary-text">Choose a date and time to see available slots.</span>
      </div>

     
      <div class="slots-grid" id="vip-slots-container">
        <!-- Injected by vip.js -->
      </div>

   
      <div id="my-reservations-section" style="display:none; margin-top:24px;">
        <h2 style="font-size:18px; margin-bottom:12px; display:flex; align-items:center; gap:8px;">
          <i class="fas fa-list-check" style="color:#a855f7;"></i>
          Your Active Reservations
        </h2>
        <div id="my-reservations-list"></div>
      </div>

   
      <div id="vip-gate-panel" style="margin-top:24px; padding:20px; border-radius:12px;
           background:rgba(168,85,247,0.12); border:1px solid rgba(168,85,247,0.4); display:none;">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;">
          <i class="fas fa-key" style="color:#a855f7;font-size:18px;"></i>
          <strong style="font-size:15px;">Enter your VIP code at the gate</strong>
        </div>
        <div style="display:flex;gap:8px;">
          <input id="vip-code-input" type="text" maxlength="4" inputmode="numeric"
            placeholder="4-digit code"
            style="flex:1;padding:12px;border-radius:8px;border:1px solid rgba(255,255,255,0.15);
                   background:rgba(0,0,0,0.25);color:inherit;font-size:18px;letter-spacing:6px;
                   text-align:center;outline:none;" />
          <button id="vip-code-submit"
            style="padding:12px 20px;border-radius:8px;border:none;cursor:pointer;
                   background:#a855f7;color:white;font-weight:600;">
            Open Gate
          </button>
        </div>
        <div id="vip-code-msg" style="margin-top:10px;font-size:13px;min-height:18px;"></div>
      </div>

    
      <div class="reserve-section">
        <div class="reserve-info">
          <i class="fas fa-car"></i>
          <div>
            <h3>Confirm reservation</h3>
            <p id="selected-slot-label">No slot selected yet.</p>
          </div>
        </div>
        <button class="btn btn-vip" id="confirm-vip-btn" type="button" disabled>
          <i class="fas fa-check"></i> Confirm VIP booking
        </button>
      </div>

    </div>

    <div id="toast" class="toast">
      <i class="fas fa-check-circle" style="margin-right: 10px;"></i>
      <span id="toast-text"></span>
    </div>
  </div>

  <script src="vip.js"></script>
</body>
</html>
